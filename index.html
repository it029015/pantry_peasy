  header { text-align: center; margin: 32px 0 28px; }
  header img {
    width: 128px; height: 128px; border-radius: 28px; box-shadow: var(--shadow);

  h1 { font-size: 34px; line-height: 1.15; margin: 18px 0 6px; }
  .tagline { color: var(--muted); margin: 0 auto; max-width: 520px; }

  h2 { font-size: 22px; margin: 36px 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 18px 20px;
  }

  details { border-bottom: 1px solid var(--border); }
  details:last-child { border-bottom: none; }
  summary {
    list-style: none; cursor: pointer; padding: 14px 28px 14px 0; position: relative;
    font-weight: 600;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: "+"; position: absolute; right: 2px; top: 10px;
    font-size: 24px; font-weight: 400; color: var(--accent);
  }
  details[open] summary::after { content: "–"; }
  details p { margin: 0 0 16px; color: var(--muted); }

  .contact { text-align: center; }
  .contact p { margin: 0 0 16px; }
  .btn {
    display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
    font-weight: 600; padding: 12px 22px; border-radius: 14px;
  }
  .privacy p { margin: 0; color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 40px; }
</style>

  mail: "Contactar o suporte",
  privacyTitle: "Privacidade",
  privacyText: "O Pantry Peasy não pede uma conta nem recolhe dados pessoais. Os seus alimentos ficam no seu iPhone e, se usar a despensa familiar, no seu iCloud, partilhados apenas com as pessoas que convidar.",
  footer: "© {y} Pantry Peasy. Todos os direitos reservados.",
},
};

function pickInitial() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (T[fromUrl]) return fromUrl;
  try {
    const saved = localStorage.getItem("lang");
    if (T[saved]) return saved;
  } catch (e) {}
  for (const l of navigator.languages || [navigator.language || "it"]) {
    const code = l.slice(0, 2).toLowerCase();
    if (T[code]) return code;
  }
  return "en";
}

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  for (const id of ["tagline", "faqTitle", "contactTitle", "contactText", "privacyTitle", "privacyText"]) {
    document.getElementById(id).textContent = t[id];
  }
  document.getElementById("footer").textContent = t.footer.replace("{y}", new Date().getFullYear());

  const mail = document.getElementById("mail");
  mail.textContent = t.mail;
  mail.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Pantry Peasy – " + t.mail)
    + "&body=" + encodeURIComponent(t.mailBody);

  const faq = document.getElementById("faq");
  faq.replaceChildren(...t.faq.map(([q, a]) => {
    const d = document.createElement("details");
    const s = document.createElement("summary");
    const p = document.createElement("p");
    s.textContent = q;
    p.textContent = a;
    d.append(s, p);
    return d;
  }));

  for (const b of document.querySelectorAll("#langs button")) {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
  }
  try { localStorage.setItem("lang", lang); } catch (e) {}
}

const nav = document.getElementById("langs");
for (const [code, label] of LANGS) {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.lang = code;
  b.textContent = label;
  b.addEventListener("click", () => render(code));
  nav.append(b);
}
render(pickInitial());
</script>
</body>
</html>
